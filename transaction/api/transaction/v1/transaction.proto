syntax = "proto3";

package transaction.v1;

option go_package = "transaction/api/transaction/v1;v1";

import "google/api/annotations.proto";

service TransactionService {

  rpc CreateTransaction(CreateTransactionRequest) returns (CreateTransactionReply) {
    option (google.api.http) = {
      post: "/v1/transactions"
      body: "*"
    };
  }

  rpc GetTransaction(GetTransactionRequest) returns (GetTransactionReply) {
    option (google.api.http) = {
      get: "/v1/transactions/{transaction_id}"
    };
  }

  rpc GetTransactions(GetTransactionsRequest) returns (GetTransactionsReply) {
    option (google.api.http) = {
      get: "/v1/transactions"
    };
  }

  rpc UpdateTransaction(UpdateTransactionRequest) returns (UpdateTransactionReply) {
    option (google.api.http) = {
      patch: "/v1/transactions/{transaction_id}"
      body: "*"
    };
  }

  rpc DeleteTransaction(DeleteTransactionRequest) returns (DeleteTransactionReply) {
    option (google.api.http) = {
      delete: "/v1/transactions/{transaction_id}"
    };
  }
}

message CreateTransactionRequest {
  int64 payment_id = 1;
  int64 account_id = 2;
  int64 related_transaction_id = 3;
  string transaction_type = 4;
  string amount = 5;
  string currency = 6;
  string description = 7;
  string reference_number = 8;
  string merchant_info = 9;
  string posting_date = 10;
}

message CreateTransactionReply {
  string message = 1;
  int64 transaction_id = 2;
}

message GetTransactionRequest {
  int64 transaction_id = 1;
}

message GetTransactionReply {
  int64 transaction_id = 1;
  int64 payment_id = 2;
  int64 account_id = 3;
  int64 related_transaction_id = 4;
  string transaction_type = 5;
  string amount = 6;
  string currency = 7;
  string status = 8;
  string description = 9;
  string reference_number = 10;
  string merchant_info = 11;
  string posting_date = 12;
  string transaction_date = 13;
  string created_at = 14;
  string posted_at = 15;
  string archived_at = 16;
}

message GetTransactionsRequest {
}

message GetTransactionsReply {
  repeated GetTransactionReply transactions = 1;
}

message UpdateTransactionRequest {
  int64 transaction_id = 1;

  optional string transaction_type = 2;
  optional string amount = 3;
  optional string currency = 4;
  optional string status = 5;
  optional string description = 6;
  optional string merchant_info = 7;
  optional string posting_date = 8;
}

message UpdateTransactionReply {
  string message = 1;
}

message DeleteTransactionRequest {
  int64 transaction_id = 1;
}

message DeleteTransactionReply {
  string message = 1;
}