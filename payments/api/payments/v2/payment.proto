syntax = "proto3";

package payments.v2;

option go_package = "payments/api/payments/v2;v2";

import "google/api/annotations.proto";

service PaymentsService {

  rpc CreatePayment(CreatePaymentRequest) returns (CreatePaymentReply) {
    option (google.api.http) = {
      post: "/v1/payments"
      body: "*"
    };
  }

  rpc GetPayment(GetPaymentRequest) returns (GetPaymentReply) {
    option (google.api.http) = {
      get: "/v1/payments/{payment_id}"
    };
  }

  rpc GetPayments(GetPaymentsRequest) returns (GetPaymentsReply) {
    option (google.api.http) = {
      get: "/v1/payments"
    };
  }

  rpc UpdatePayment(UpdatePaymentRequest) returns (UpdatePaymentReply) {
    option (google.api.http) = {
      patch: "/v1/payments/{payment_id}"
      body: "*"
    };
  }

  rpc DeletePayment(DeletePaymentRequest) returns (DeletePaymentReply) {
    option (google.api.http) = {
      delete: "/v1/payments/{payment_id}"
    };
  }
}

message CreatePaymentRequest {
  int64 from_account_id = 1;
  int64 to_account_id = 2;
  string payment_type = 3;
  string amount = 4;
  string currency = 5;
  string payment_method = 6;
  string reference_number = 7;
  string external_reference = 8;
  string scheduled_at = 9;
}

message CreatePaymentReply {
  string message = 1;
}

message GetPaymentRequest {
  int64 payment_id = 1;
}

message GetPaymentReply {
  int64 payment_id = 1;
  int64 from_account_id = 2;
  int64 to_account_id = 3;
  string payment_type = 4;
  string amount = 5;
  string currency = 6;
  string status = 7;
  string payment_method = 8;
  string reference_number = 9;
  string external_reference = 10;
  string scheduled_at = 11;
  string processed_at = 12;
  string created_at = 13;
}

message GetPaymentsRequest {
}

message GetPaymentsReply {
  repeated GetPaymentReply payments = 1;
}

message UpdatePaymentRequest {
  int64 payment_id = 1;
  optional string payment_type = 2;
  optional string amount = 3;
  optional string currency = 4;
  optional string status = 5;
  optional string payment_method = 6;
  optional string external_reference = 7;
  optional string scheduled_at = 8;
}

message UpdatePaymentReply {
  string message = 1;
}

message DeletePaymentRequest {
  int64 payment_id = 1;
}

message DeletePaymentReply {
  string message = 1;
}