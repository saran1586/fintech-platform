syntax = "proto3";

package account.v1;

option go_package = "account/api/account/v1;v1";

import "google/api/annotations.proto";

service AccountService {
rpc CreateAccount(CreateAccountRequest) returns (CreateAccountReply) {
  option (google.api.http) = {
    post: "/v1/accounts"
    body: "*"
  };
}
  rpc GetAccount(GetAccountRequest) returns (GetAccountReply) {
  option (google.api.http) = {
    get: "/v1/accounts/{account_id}"
  };
}


  rpc GetAccounts(GetAccountsRequest) returns (GetAccountsReply) {
    option (google.api.http) = {
      get: "/v1/accounts"
    };
  }

     rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountReply) {
  option (google.api.http) = {
    patch: "/v1/accounts/{account_id}"
    body: "*"
  };
}
  rpc DeleteAccount(DeleteAccountRequest) returns (DeleteAccountReply) {
    option (google.api.http) = {
      delete: "/v1/accounts/{account_id}"
    };
  }

  rpc DebitAccount(DebitAccountRequest) returns (DebitAccountReply);

  rpc CreditAccount(CreditAccountRequest) returns (CreditAccountReply) {
  option (google.api.http) = {
    patch: "/v1/accounts/{account_id}/credit"
    body: "*"
  };
}
}


message CreateAccountRequest {
  int64 customer_id = 1;
  string account_type = 2;
  string currency = 3;
}

message CreateAccountReply {
  string message = 1;
}
message GetAccountRequest {
  int64 account_id = 1;
}

message GetAccountReply {
  int64 account_id = 1;
  int64 customer_id = 2;
  string account_number = 3;
  string account_type = 4;
  string currency = 5;
  string status = 6;
  string available_balance = 7;
  string pending_balance = 8;
  string credit_limit = 9;
  string created_at = 10;
  string updated_at = 11;
  string last_transaction_at = 12;
}

message GetAccountsRequest {
}

message GetAccountsReply {
  repeated Account accounts = 1;
}

message Account {
  int64 account_id = 1;
  int64 customer_id = 2;
  string account_number = 3;
  string account_type = 4;
  string currency = 5;
  string status = 6;
  string available_balance = 7;
  string pending_balance = 8;
  string credit_limit = 9;
  string created_at = 10;
  string updated_at = 11;
  string last_transaction_at = 12;
}

message UpdateAccountRequest {
  int64 account_id = 1;
  optional string account_type = 2;
  optional string currency = 3;
  optional string status = 4;
  optional string credit_limit = 5;
}

message UpdateAccountReply {
  string message = 1;
}

message DeleteAccountRequest {
  int64 account_id = 1;
}

message DeleteAccountReply {
  string message = 1;
}

message DebitAccountRequest {
  int64 account_id = 1;
  string amount = 2;
}

message DebitAccountReply {
  string message = 1;
}

message CreditAccountRequest {
  int64 account_id = 1;
  string amount = 2;
}
message CreditAccountReply {
  string message = 1;
  string available_balance = 2;
}

