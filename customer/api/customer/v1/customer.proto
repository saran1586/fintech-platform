syntax = "proto3";

package customer.v1;

import "google/api/annotations.proto";

option go_package = "customer/api/customer/v1;v1";

service CustomerService {
  rpc CreateCustomer(CreateCustomerRequest) returns (CreateCustomerReply) {
    option (google.api.http) = {
      post: "/v1/customers"
      body: "*"
    };
  }

  rpc GetCustomer(GetCustomerRequest) returns (GetCustomerReply) {
  option (google.api.http) = {
    get: "/v1/customers/{customer_id}"
  };
}
  rpc GetCustomers(GetCustomersRequest) returns (GetCustomersReply) {
  option (google.api.http) = {
    get: "/v1/customers"
  };
}

rpc UpdateCustomer(UpdateCustomerRequest) returns (UpdateCustomerReply) {
  option (google.api.http) = {
    patch: "/v1/customers/{customer_id}"
    body: "*"
  };
}

rpc DeleteCustomer(DeleteCustomerRequest) returns (DeleteCustomerReply) {
  option (google.api.http) = {
    delete: "/v1/customers/{customer_id}"
  };
}
}



message CreateCustomerRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string phone = 4;
  string date_of_birth = 5;
}

message CreateCustomerReply {
  string message = 1;
}



message GetCustomerRequest {
  int64 customer_id = 1;
}

message GetCustomerReply {
  int64 customer_id = 1;
  string customer_number = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
  string date_of_birth = 7;
  string status = 8;
  string kyc_status = 9;
}

message GetCustomersRequest {
  int32 page = 1;
  int32 page_size = 2;
}
message Customer {
  int64 customer_id = 1;
  string customer_number = 2;
  string first_name = 3;
  string last_name = 4;
  string email = 5;
  string phone = 6;
  string date_of_birth = 7;
  string status = 8;
  string kyc_status = 9;
}

message GetCustomersReply {
  repeated Customer customers = 1;
}

message UpdateCustomerRequest {
  int64 customer_id = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string email = 4;
  optional string phone = 5;
  optional string date_of_birth = 6;
}

message UpdateCustomerReply {
  string message = 1;
}


message DeleteCustomerRequest {
  int64 customer_id = 1;
}

message DeleteCustomerReply {
  string message = 1;
}